# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-vconnect"
BBFILE_PATTERN_meta-vconnect = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-vconnect = "6"

LAYERDEPENDS_meta-vconnect = "core"
LAYERSERIES_COMPAT_meta-vconnect = "scarthgap"
