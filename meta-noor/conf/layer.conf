# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-noor"
BBFILE_PATTERN_meta-noor = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-noor = "6"

LAYERDEPENDS_meta-noor = "core"
LAYERSERIES_COMPAT_meta-noor = "scarthgap"
